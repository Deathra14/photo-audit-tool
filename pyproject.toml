[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-audit-tool"
version = "0.2.0"
description = "Local-first photo collection audit for CSV and Excel inventories"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Agung Maulana"}]
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
photo-audit = "photo_audit.cli:main"

[tool.setuptools.packages.find]
include = ["photo_audit*"]
